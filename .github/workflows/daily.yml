name: Daily summary

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the daily summary
        run: python scripts/daily_summary.py

      - name: Keep the generated XML files for a week
        uses: actions/upload-artifact@v4
        with:
          name: ubl-xml
          path: output/
          retention-days: 7

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --staged --quiet || git commit -m "Daily summary $(date -u +%F)"
          git push